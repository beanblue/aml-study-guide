<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>反洗钱法规知识解释器 v2</title><style>
:root{--bg:#fff;--panel:#f9f8f7;--soft:#f0efed;--text:#2c2c2b;--muted:#7d7a75;--border:#e6e5e3;--blue:#2783de;--blue2:#e5f2fc;--green:#46a171;--green2:#e8f1ec;--orange:#d5803b;--orange2:#fbebde;--purple:#8b62d9;--purple2:#f0eafd;--red:#e56458;--red2:#fce9e7;--shadow:0 1px 2px rgba(0,0,0,.05),0 12px 40px rgba(0,0,0,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang SC","Microsoft YaHei",sans-serif}.top{height:72px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:0 22px;border-bottom:1px solid var(--border);background:#fff;position:sticky;top:0;z-index:5}.brand b{font-size:20px}.brand span{display:block;font-size:12px;color:var(--muted)}.gate{display:flex;gap:8px;justify-content:center}.gate button{border:1px solid var(--border);background:var(--panel);border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.gate button.active{background:var(--blue);border-color:var(--blue);color:#fff}.search{width:300px;border:1px solid var(--border);border-radius:12px;padding:11px 14px}.shell{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 72px)}.side{background:var(--panel);border-right:1px solid var(--border);padding:18px;overflow:auto}.sideTitle{font-size:13px;color:var(--muted);font-weight:900;letter-spacing:.05em;margin:0 0 12px}.side button{width:100%;border:1px solid var(--border);background:#fff;border-radius:12px;padding:12px 13px;margin-bottom:9px;text-align:left;font-weight:750;cursor:pointer;color:var(--text)}.side button.active{background:var(--blue);border-color:var(--blue);color:#fff}.main{padding:28px 36px 80px;overflow:auto}.canvas{max-width:1380px;margin:0 auto}.eyebrow{font-size:13px;color:var(--blue);font-weight:900;letter-spacing:.05em}h1{font-size:34px;line-height:1.15;margin:4px 0 8px}p{color:var(--muted);margin:0 0 12px}.view{display:none}.view.active{display:block}.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}.map{min-height:620px;padding:28px;position:relative;overflow:hidden}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:235px;height:235px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:23px;font-weight:950;box-shadow:0 16px 50px rgba(39,131,222,.25)}.node{position:absolute;width:235px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:15px;cursor:pointer}.node:hover,.box:hover,.topic:hover,.law:hover{outline:2px solid var(--blue)}.node h3,.box h3,.topic h3,.law h3{margin:0 0 6px;font-size:17px}.node p,.box p,.topic p,.law p{font-size:13px}.n1{left:6%;top:8%}.n2{left:38%;top:5%}.n3{right:6%;top:8%}.n4{left:5%;top:42%}.n5{right:5%;top:42%}.n6{left:10%;bottom:7%}.n7{left:38%;bottom:4%}.n8{right:10%;bottom:7%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.box,.topic,.law{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;cursor:pointer;min-height:150px}.topic.core{background:var(--blue2);border-color:#b8dcfb}.topic.app{background:var(--purple2);border-color:#dbcaf9}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:850;margin:3px}.b{background:var(--blue2);color:var(--blue)}.g{background:var(--green2);color:var(--green)}.o{background:var(--orange2);color:var(--orange)}.p{background:var(--purple2);color:var(--purple)}.path{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.step{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;cursor:pointer;min-height:160px}.lawList{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.law small{display:block;color:var(--muted);font-size:13px}.articlePreview{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}.article{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;font-size:14px}.detail{position:fixed;left:calc(100vw - 500px);top:96px;width:460px;height:620px;min-width:330px;min-height:260px;max-width:88vw;max-height:82vh;background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:0 22px 80px rgba(0,0,0,.22);z-index:20;display:none;resize:both;overflow:auto}.detail.open{display:block}.bar{height:46px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;border-bottom:1px solid var(--border);cursor:move;background:var(--panel);border-radius:18px 18px 0 0}.bar b{font-size:14px}.iconBtn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:5px 8px;cursor:pointer}.detailBody{padding:16px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tab{border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:6px 10px;font-weight:750;cursor:pointer;font-size:13px}.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}.tabpane{display:none}.tabpane.active{display:block}.block{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;margin:10px 0}.list{margin:0;padding-left:20px;color:var(--muted)}.mini{display:none;position:fixed;right:24px;bottom:24px;z-index:21;background:var(--blue);color:#fff;border-radius:999px;padding:12px 16px;font-weight:850;box-shadow:var(--shadow);cursor:pointer}.mini.show{display:block}@media(max-width:980px){.top{height:auto;grid-template-columns:1fr;padding:14px}.gate{justify-content:flex-start;overflow:auto}.search{width:100%}.shell{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--border)}.main{padding:20px}.grid,.grid2,.path,.lawList{grid-template-columns:1fr}.map{min-height:auto}.center,.node{position:static;transform:none;width:auto;height:auto;border-radius:16px;margin-bottom:10px}.detail{left:16px;top:90px;width:calc(100vw - 32px)}}
</style></head><body><header class="top"><div class="brand"><b>反洗钱法规知识解释器</b><span>保险公司反洗钱工作人员 · v2 信息架构</span></div><nav class="gate"><button class="active" data-gate="primer">前置扫盲</button><button data-gate="god">上帝视角</button><button data-gate="themes">主题学习</button><button data-gate="laws">法规全文</button></nav><input class="search" placeholder="搜索条文 / 主题 / 文件" oninput="filterExplorer()"></header><div class="shell"><aside class="side"><div class="sideTitle" id="sideTitle">前置扫盲</div><div id="sideNav"></div></aside><main class="main"><div class="canvas" id="content"></div></main></div><div class="detail" id="detail"><div class="bar" id="dragbar"><b id="detailTitle">详情</b><div><button class="iconBtn" id="pinBtn">固定</button><button class="iconBtn" id="minBtn">最小化</button><button class="iconBtn" id="closeBtn">关闭</button></div></div><div class="detailBody"><div id="detailDesc"></div><div class="tabs"><button class="tab active" data-tab="overview">概览</button><button class="tab" data-tab="text">原文</button><button class="tab" data-tab="rel">关联</button><button class="tab" data-tab="explain">释义</button><button class="tab" data-tab="case">案例</button><button class="tab" data-tab="use">应用</button></div><div id="overview" class="tabpane active"></div><div id="text" class="tabpane"></div><div id="rel" class="tabpane"></div><div id="explain" class="tabpane"></div><div id="case" class="tabpane"></div><div id="use" class="tabpane"></div></div></div><div class="mini" id="mini">展开详情</div><script>
const navs={primer:['反洗钱是什么','为什么保险业要关注','反洗钱工作角色','金融机构核心义务','法律责任概览'],god:['知识体系总图','义务结构图','法规效力图','保险业落地图'],themes:['客户尽职调查','受益所有人识别','资料保存','大额交易报告','可疑交易报告','特别预防措施','内控治理','法律责任','保险业务场景应用'],laws:['法律','部门规章','规范性文件 / 指引','保险业专项']};
const lawNames=['《中华人民共和国反洗钱法》','《金融机构客户尽职调查和客户身份资料及交易记录保存管理办法》','《金融机构大额交易和可疑交易报告管理办法》','《反洗钱特别预防措施管理办法》','《受益所有人信息管理办法》','《金融机构客户受益所有人识别管理办法》','《中国人民银行关于大额交易和可疑交易报告要素及释义的通知》','《金融机构反洗钱客户尽职调查工作指引》','《保险业反洗钱工作管理办法》'];
function d(title,desc,type='知识点'){detail.classList.add('open');mini.classList.remove('show');detailTitle.textContent=title;detailDesc.innerHTML='<p>'+desc+'</p>';overview.innerHTML='<div class="block"><b>这是什么？</b><p>'+desc+'</p></div><div class="block"><b>体系位置</b><p>'+type+'｜可挂接原文、主题、关系和学习解释。</p></div>';text.innerHTML='<div class="block"><b>原文层</b><p>点击左侧法规名称查看逐条原文 / 条文全文 / 字段释义。功能开发中。</p></div>';rel.innerHTML='<div class="block"><b>关联条文</b><ul class="list"><li>上位依据</li><li>下位细化</li><li>同主题关联</li><li>保险业适用条款</li></ul></div>';explain.innerHTML='<div class="block"><b>解释层</b><p>小白解释 + 专业释义 + 未来接入《反洗钱法》逐条法律解释。</p></div>';document.getElementById('case').innerHTML='<div class="block"><b>案例层</b><p>可放入保险业务场景：投保、保全、退保、理赔、代理渠道等。</p></div>';use.innerHTML='<div class="block"><b>实务应用</b><ul class="list"><li>制度建设</li><li>流程设计</li><li>培训讲解</li><li>检查整改</li></ul></div>'}
function render(gate,idx=0){sideTitle.textContent={primer:'前置扫盲',god:'上帝视角',themes:'主题学习',laws:'法规全文'}[gate];sideNav.innerHTML=navs[gate].map((x,i)=>'<button class="'+(i==idx?'active':'')+'" data-i="'+i+'">'+x+'</button>').join('');[...sideNav.children].forEach(b=>b.onclick=()=>render(gate,+b.dataset.i)); if(gate==='primer') primer(idx); if(gate==='god') god(idx); if(gate==='themes') themes(idx); if(gate==='laws') laws(idx)}
function primer(i){const items=navs.primer;content.innerHTML='<div class="eyebrow">PRIMER</div><h1>'+items[i]+'</h1><p>前置扫盲是进入法规全文和主题学习前的认知底座，不追求穷尽条文，而是先建立脑内框架。</p><div class="card" style="padding:24px"><div class="grid">'+items.map(x=>'<div class="box" data-title="'+x+'" data-desc="明确反洗钱、恐怖融资等核心概念的定义与范围。"><h3>'+x+'</h3><p>基础解释、核心概念、对应条文入口。</p><span class="badge b">扫盲</span></div>').join('')+'</div></div>';bind()}
function god(i){const views=[['知识体系总图','以知识点为核心，不先看31份文件。'],['义务结构图','围绕金融机构核心义务展开。'],['法规效力图','展示法律、部门规章、规范性文件、行业专项之间的层级。'],['保险业落地图','把通用义务映射到保险公司业务场景。']];content.innerHTML='<div class="eyebrow">GOD VIEW</div><h1>'+views[i][0]+'</h1><p>'+views[i][1]+'</p><div class="card map"><div class="center" data-title="反洗钱法规知识体系" data-desc="所有条文都进入体系，但首页先展示知识结构。">反洗钱法规<br>知识体系</div>'+['基础概念与监管框架','内控治理与组织责任','客户尽职调查','受益所有人识别','资料保存','大额与可疑交易报告','特别预防措施','法律责任与保险业应用'].map((x,n)=>'<div class="node n'+(n+1)+'" data-title="'+x+'" data-desc="该节点聚合多个法规中的相关条文，并通过详情面板呈现原文、关联、释义、案例和应用。"><h3>'+x+'</h3><p>点击查看完整解释层</p></div>').join('')+'</div>';bind()}
function themes(i){const t=navs.themes[i];content.innerHTML='<div class="eyebrow">THEME LEARNING</div><h1>'+t+'</h1><p>主题学习是一条线一条线地学：从问题、动作、依据到实务应用。</p><div class="path">'+['先看问题','再看规则','展开条文','理解关系','落到实务'].map((x,n)=>'<div class="step" data-title="'+t+'｜'+x+'" data-desc="围绕“'+t+'”主题，把不同文件的条文打通成学习路径。"><h3>'+(n+1)+' '+x+'</h3><p>相关条文、解释和应用。</p></div>').join('')+'</div><div class="card" style="padding:22px;margin-top:18px"><h3>本主题下的内容层</h3><p>本主题涵盖多个关联条文和学习要点，请结合法规库索引查阅。</p></div>';bind()}
function laws(i){const groups=[['法律',[lawNames[0]]],['部门规章',lawNames.slice(1,6)],['规范性文件 / 指引',lawNames.slice(6,8)],['保险业专项',[lawNames[8]]]][i];content.innerHTML='<div class="eyebrow">FULL TEXT</div><h1>'+groups[0]+'</h1><p>法规全文入口保证完整性：所有文件、所有条文、所有指定范围都完整呈现。</p><div class="lawList">'+groups[1].map(x=>'<div class="law" data-title="'+x+'" data-desc="法规全文模式：完整目录、完整条文、条文所属主题、关联条文和解释层。"><h3>'+x+'</h3><small>点击进入完整目录和条文</small><div class="articlePreview"><div class="article">第一条 请点击左侧法规名称查看完整原文</div><div class="article">第二条 请点击左侧法规名称查看完整原文</div><div class="article">更多条文请查看法规库</div></div></div>').join('')+'</div>';bind()}
function bind(){document.querySelectorAll('[data-title]').forEach(el=>el.onclick=()=>d(el.dataset.title,el.dataset.desc,el.className.includes('law')?'法规全文':'知识节点'))}
document.querySelectorAll('.gate button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.gate button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.gate,0)});document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tabpane').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById(t.dataset.tab).classList.add('active')});closeBtn.onclick=()=>detail.classList.remove('open');minBtn.onclick=()=>{detail.classList.remove('open');mini.classList.add('show')};mini.onclick=()=>{detail.classList.add('open');mini.classList.remove('show')};pinBtn.onclick=()=>{detail.style.left='calc(100vw - 500px)';detail.style.top='96px'};
let drag=false,dx=0,dy=0;dragbar.onmousedown=e=>{drag=true;dx=e.clientX-detail.offsetLeft;dy=e.clientY-detail.offsetTop};document.onmousemove=e=>{if(drag){detail.style.left=(e.clientX-dx)+'px';detail.style.top=(e.clientY-dy)+'px'}};document.onmouseup=()=>drag=false;render('primer',0);

// 搜索过滤功能
function filterExplorer(){
 var q=(document.querySelector('.search')||{}).value||'';
 q=q.trim().toLowerCase();
 if(!q){return;}
 // 搜索法规名称、条文、主题
 var items=document.querySelectorAll('.gate-item,.law-row,.theme-card');
 items.forEach(function(item){
  var text=item.textContent.toLowerCase();
  item.style.display=text.indexOf(q)>-1?'':'none';
 });
}
</script></body></html>
